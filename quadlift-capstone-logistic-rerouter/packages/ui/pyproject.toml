[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanbridge-ui"
version = "0.1.0"
description = "OceanBridge Control Tower dashboard (Streamlit)"
requires-python = ">=3.11"
dependencies = [
    "oceanbridge-core",
    "streamlit>=1.40",
    "pydeck>=0.9",
    "pandas>=2.2",
    "httpx>=0.27",
]

[project.scripts]
oceanbridge-ui = "oceanbridge.ui.__main__:main"

# Every package contributes to the shared `oceanbridge` namespace (no oceanbridge/__init__.py).
[tool.setuptools.packages.find]
where = ["src"]
include = ["oceanbridge*"]
namespaces = true

# For uv users: resolve sibling packages from this workspace.
[tool.uv.sources]
oceanbridge-core = { workspace = true }
