[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanbridge-agent-chat-assistant"
version = "0.1.0"
description = "Chat Assistant agent: agentic tool calling over the MCP servers and local tools, with memory"
requires-python = ">=3.11"
dependencies = [
    "oceanbridge-core",
    "oceanbridge-agent-common",
    "openai>=1.40",
    "pyyaml>=6.0",
]

# Every package contributes to the shared `oceanbridge` namespace (no oceanbridge/__init__.py).
[tool.setuptools.packages.find]
where = ["src"]
include = ["oceanbridge*"]
namespaces = true

[tool.setuptools.package-data]
"oceanbridge.agents.chat_assistant" = ["agent.yaml"]

# For uv users: resolve sibling packages from this workspace.
[tool.uv.sources]
oceanbridge-core = { workspace = true }
oceanbridge-agent-common = { workspace = true }
